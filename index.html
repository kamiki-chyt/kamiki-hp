<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>神木チャンネル</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: min(900px, 90%);
      margin: auto;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      margin-bottom: 35px;
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(255,255,255,0.08);
    }

    h1 {
      font-size: clamp(42px, 10vw, 90px);
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .sub {
      margin-top: 15px;
      color: #aaa;
      font-size: 15px;
      letter-spacing: 0.2em;
    }

    .scroll {
      margin-top: 60px;
      font-size: 12px;
      color: #777;
      letter-spacing: 0.25em;
    }

    section {
      padding: 100px 0;
      border-top: 1px solid #222;
    }

    .section-title {
      font-size: 14px;
      color: #888;
      letter-spacing: 0.25em;
      margin-bottom: 25px;
    }

    .intro {
      font-size: clamp(24px, 5vw, 42px);
      line-height: 1.7;
      font-weight: 700;
    }

    .members {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 40px;
    }

    .member {
      padding: 35px 25px;
      border: 1px solid #333;
      border-radius: 18px;
      background: #0d0d0d;
    }

    .member-name {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .member-role {
      color: #888;
      font-size: 13px;
    }

    .message {
      color: #bbb;
      line-height: 2;
      margin-top: 20px;
    }

    .企画 {
      padding: 30px;
      margin-top: 30px;
      border-radius: 18px;
      background: #111;
      border: 1px solid #292929;
    }

    .企画 h3 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .企画 p {
      color: #999;
      line-height: 1.8;
    }

    footer {
      padding: 50px 0;
      text-align: center;
      color: #555;
      font-size: 12px;
      letter-spacing: 0.15em;
    }

    @media (max-width: 600px) {
      .members {
        grid-template-columns: 1fr;
      }

      .logo {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">

      <!-- アイコン -->
      <img src="7550.png" alt="神木チャンネル アイコン" class="logo">

      <h1>神木チャンネル</h1>

      <p class="sub">
        2人で、なんか面白いこと。
      </p>

      <p class="scroll">
        SCROLL ↓
      </p>

    </div>
  </header>


  <section>
    <div class="container">

      <p class="section-title">ABOUT US</p>

      <p class="intro">
        はじめまして。<br>
        神木チャンネルです。
      </p>

      <p class="message">
        2人でいろんなことに挑戦して、<br>
        「ちょっと面白い」を動画にしていきます。
      </p>

    </div>
  </section>


  <section>
    <div class="container">

      <p class="section-title">MEMBERS</p>

      <div class="members">

        <div class="member">
          <div class="member-name">かみと</div>
          <div class="member-role">KAMITO</div>
        </div>

        <div class="member">
          <div class="member-name">きぃ</div>
          <div class="member-role">KII</div>
        </div>

      </div>

    </div>
  </section>


  <section>
    <div class="container">

      <p class="section-title">NEXT PROJECT</p>

      <p class="intro">
        次は、<br>
        何をする？
      </p>

      <div class="企画">
        <h3>COMING SOON...</h3>
        <p>
          神木チャンネルの2人が<br>
          いろんな企画に挑戦します。
        </p>
      </div>

    </div>
  </section>


  <footer>
    KAMIKI CHANNEL © 2026
  </footer>

</body>
</html>
